name: Build and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag'
        required: true
        default: '0.0.1'
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            preinstall_plugins: "0"
            suffix: ""
            latest_tag: "latest"
          - variant: market
            preinstall_plugins: "1"
            suffix: "-market"
            latest_tag: "market"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: meta-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="0.0.1"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Tags
        id: docker_meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/deepseek-harness-docker"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ steps.meta-version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          LATEST_TAG="${{ matrix.latest_tag }}"

          TAGS=""
          TAGS="${TAGS}${IMAGE_NAME}:${VERSION}${SUFFIX},"
          TAGS="${TAGS}${IMAGE_NAME}:v${VERSION}${SUFFIX},"
          TAGS="${TAGS}${IMAGE_NAME}:${LATEST_TAG}"

          if [ "${{ matrix.variant }}" = "market" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest-market"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            PREINSTALL_PLUGINS=${{ matrix.preinstall_plugins }}
            USE_CHINA_MIRROR=0
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
