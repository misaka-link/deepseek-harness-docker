name: Build and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Project version tag (e.g. 0.0.4)'
        required: false
        default: '0.0.4'
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            preinstall_plugins: "0"
            suffix: ""
            latest_tag: "latest"
          - variant: market
            preinstall_plugins: "1"
            suffix: "-market"
            latest_tag: "latest-market"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Project Version
        id: meta-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            PROJ_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?([0-9]+.[0-9]+.[0-9]+.*)$ ]]; then
            PROJ_VER="${BASH_REMATCH[1]}"
          else
            PROJ_VER="0.0.4"
          fi
          PROJ_VER="${PROJ_VER#v}"
          echo "project_version=${PROJ_VER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Tags
        id: docker_meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/deepseek-harness-docker"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          SUFFIX="${{ matrix.suffix }}"
          LATEST_TAG="${{ matrix.latest_tag }}"
          PROJ_VER="${{ steps.meta-version.outputs.project_version }}"

          # 1. 探测镜像内置的官方 DeepSeek Harness 核心版本号
          DSH_VERSION=$(curl -s https://registry.npmjs.org/@deepseek-ai/dsh/latest | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || echo "0.1.2-rc.1")
          if [ -z "$DSH_VERSION" ]; then
            DSH_VERSION="0.1.2-rc.1"
          fi
          echo "Detected built-in DSH Version: ${DSH_VERSION}"
          echo "Current Project Version: ${PROJ_VER}"

          TAGS=""
          # 默认主标签 (:latest / :latest-market)
          TAGS="${TAGS}${IMAGE_NAME}:${LATEST_TAG},"

          # 额外标签一：内置官方 DeepSeek Harness 版本号
          TAGS="${TAGS}${IMAGE_NAME}:${DSH_VERSION}${SUFFIX},"
          TAGS="${TAGS}${IMAGE_NAME}:dsh-${DSH_VERSION}${SUFFIX},"

          # 额外标签二：本项目工程版本号
          TAGS="${TAGS}${IMAGE_NAME}:${PROJ_VER}${SUFFIX},"
          TAGS="${TAGS}${IMAGE_NAME}:v${PROJ_VER}${SUFFIX}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            PREINSTALL_PLUGINS=${{ matrix.preinstall_plugins }}
            USE_CHINA_MIRROR=0
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
