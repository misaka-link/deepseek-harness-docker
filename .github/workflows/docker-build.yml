name: Build and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Project version tag (e.g. 0.1.0)'
        required: false
        default: '0.1.0'
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  packages: write

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version_detector.outputs.should_build }}
      project_version: ${{ steps.version_detector.outputs.project_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Version Change
        id: version_detector
        run: |
          SHOULD_BUILD="true"

          # 1. 手动 workflow_dispatch 触发
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJ_VER="${{ github.event.inputs.version }}"
            [ -z "$PROJ_VER" ] && PROJ_VER="0.1.0"
            echo "✔ 手动触发 (workflow_dispatch)，指定版本: ${PROJ_VER}"

          # 2. Git Tag 触发 (如 v0.0.9)
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            PROJ_VER="${BASH_REMATCH[1]}"
            echo "✔ Git Tag 触发发布，版本: ${PROJ_VER}"

          # 3. main 分支 push 触发：严格比对版本号是否变动
          else
            PROJ_VER=$(grep -E '^PROJ_VER=' build.sh | cut -d'"' -f2 || true)
            [ -z "$PROJ_VER" ] && PROJ_VER="0.1.0"

            PREV_VER=$(git show HEAD~1:build.sh 2>/dev/null | grep -E '^PROJ_VER=' | cut -d'"' -f2 || true)
            echo "当前版本: [${PROJ_VER}], 上一提交版本: [${PREV_VER}]"

            if [ -n "$PREV_VER" ] && [ "$PROJ_VER" = "$PREV_VER" ]; then
              echo "⚠ 项目版本号未发生变动 (${PROJ_VER} == ${PREV_VER})，跳过镜像自动构建与发布！"
              SHOULD_BUILD="false"
            else
              echo "✔ 检测到项目版本号变更 (${PREV_VER:-init} -> ${PROJ_VER})，触发镜像构建！"
            fi
          fi

          PROJ_VER="${PROJ_VER#v}"
          echo "project_version=${PROJ_VER}" >> $GITHUB_OUTPUT
          echo "should_build=${SHOULD_BUILD}" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push (${{ matrix.variant }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            preinstall_plugins: "0"
            suffix: ""
            latest_tag: "latest"
          - variant: market
            preinstall_plugins: "1"
            suffix: "-market"
            latest_tag: "latest-market"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Tags
        id: docker_meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/deepseek-harness-docker"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          SUFFIX="${{ matrix.suffix }}"
          LATEST_TAG="${{ matrix.latest_tag }}"
          PROJ_VER="${{ needs.check-version.outputs.project_version }}"

          # 探测内置的官方 DeepSeek Harness 核心版本号 (优先 alpha，其次 next / latest，与 build.sh 保持绝对一致)
          DSH_ALPHA=$(curl -s https://registry.npmjs.org/@deepseek-ai/dsh | grep -o '"alpha":"[^"]*"' | cut -d'"' -f4 || true)
          DSH_NEXT=$(curl -s https://registry.npmjs.org/@deepseek-ai/dsh | grep -o '"next":"[^"]*"' | cut -d'"' -f4 || true)
          DSH_LATEST=$(curl -s https://registry.npmjs.org/@deepseek-ai/dsh/latest | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || true)
          DSH_VERSION="${DSH_ALPHA:-${DSH_NEXT:-$DSH_LATEST}}"
          if [ -z "$DSH_VERSION" ]; then
            DSH_VERSION="0.1.6-alpha.1"
          fi
          echo "dsh_version=${DSH_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected built-in DSH Version: ${DSH_VERSION}"
          echo "Current Project Version: ${PROJ_VER}"

          TAGS=""
          # 默认主标签 (:latest / :latest-market)
          TAGS="${TAGS}${IMAGE_NAME}:${LATEST_TAG},"

          # 额外标签一：内置官方 DeepSeek Harness 版本号
          TAGS="${TAGS}${IMAGE_NAME}:${DSH_VERSION}${SUFFIX},"
          TAGS="${TAGS}${IMAGE_NAME}:dsh-${DSH_VERSION}${SUFFIX},"

          # 额外标签二：本项目工程版本号
          TAGS="${TAGS}${IMAGE_NAME}:${PROJ_VER}${SUFFIX},"
          TAGS="${TAGS}${IMAGE_NAME}:v${PROJ_VER}${SUFFIX}"

          # 兼容传统简写标签 (:market)
          if [ "${{ matrix.variant }}" = "market" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:market"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            NODE_IMAGE=node:24-trixie
            NOVNC_ASSET_REVISION=1.6.0
            PREINSTALL_PLUGINS=${{ matrix.preinstall_plugins }}
            DSH_VERSION=${{ steps.docker_meta.outputs.dsh_version }}
            USE_CHINA_MIRROR=0
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
