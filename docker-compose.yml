services:
  deepseek-harness:
    image: ghcr.io/misaka-link/deepseek-harness-docker:latest
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      # 仅暴露单个统一端口（包含 DSH Web、管理面板与 VNC 桌面，共享同一套认证）
      # 跟随 .env 的 PROXY_PORT（默认 3080），避免修改端口后宿主映射失配
      - "${PROXY_PORT:-3080}:${PROXY_PORT:-3080}"
    environment:
      # 访问认证码（必须通过此认证码才可访问 DSH Web、管理后台和 VNC 桌面）
      # 留空时：首次访问会自动引导到「初始化访问口令」页面，设置后才能使用（不再有免密直通模式）
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      # 统一对外访问端口（跟随 .env；显式 env 优先于数据卷中的持久化配置）
      - PROXY_PORT=${PROXY_PORT:-3080}
      # 运行根目录（非 root 部署时设为 /home/dsh）
      - DSH_HOME=${DSH_HOME:-/root}
      # 可选：以 root 启动时自动修正数据卷属主并通过 setpriv 降权至指定 UID/GID 运行
      # - PUID=1001
      # - PGID=1001
      # 版本切换前磁盘水位阈值(MB，默认 1536)；用于低配环境与故障演练
      - DSH_VERSIONS_MIN_FREE_MB=${DSH_VERSIONS_MIN_FREE_MB:-1536}

      # 出站网络代理（可选：DSH 原生遵循环境变量代理）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}

      # --- 以下参数均已在容器和网关内置默认值，默认注释保持简洁，按需启用：---
      # - SESSION_SECRET=${SESSION_SECRET:-}  # 自定义 Session 签名密钥 (默认自动生成并持久化至数据卷)
      # - ADMIN_PATH=/admin                  # 自定义管理面板访问路径 (默认 /admin)
      # - VNC_PATH=/vnc                      # 自定义桌面 VNC 访问路径 (默认 /vnc)
      # - DSH_WORKSPACE=/workspace           # 默认工作区目录
      # - DSH_DESKTOP_ENABLED=1              # 是否启用内置 Chromium 图形桌面 (1: 开启, 0: 关闭)
      # - DSH_IDLE_TIMEOUT_MINUTES=30        # 浏览器桌面空闲休眠时间 (分钟，0为不休眠始终保持)
      # - DSH_DESKTOP_WIDTH=1920             # 虚拟桌面宽度分辨率
      # - DSH_DESKTOP_HEIGHT=1080            # 虚拟桌面高度分辨率
      # - DSH_SCREENSHOT_QUALITY=high        # AI 截图默认画质 (high/medium/low)
      # - DSH_SCREENSHOT_DIR=                # AI 截图默认保存子目录 (相对工作区)
      # - DSH_SNAPSHOT_TIMEOUT_MS=1800000    # 快照打包/校验/还原超时时间(ms，默认 1800000 即 30 分钟)
      # - DSH_BACKUP_THREADS=                # pigz 并行压缩线程数 (默认自动取可用核数且上限 8，支持 1~64)
      # - DSH_MAX_ARCHIVE_MEMBERS=1000000    # 快照还原/导入前的成员数上限 (默认 100 万；仅当快照确实超过此规模才需调高)

    # ── 容器运行加固 ─────────────────────────────────────────────
    # 1) 禁止提权（setuid/setgid 二进制无法获得新权限）
    security_opt:
      - no-new-privileges:true
    # 2) 丢弃全部 Linux capabilities，仅回补 root 运行必需的最小集合
    #    （入口脚本要修正数据卷属主/权限、创建并管理子进程）
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    # 3) 【可选】以非 root 运行（更彻底）：取消下面两行注释，并把 volumes 换成
    #    /home/dsh/.dsh 等路径（宿主目录需 chown 1001:1001）；此时可删除上面的 cap_add 段。
    # user: "1001:1001"
    # environment 里追加: - DSH_HOME=/home/dsh
    volumes:
      # 1. DSH 系统与配置目录（存储插件、预设、配置文件与会话历史）
      - ./data/dsh:/root/.dsh
      # 2. 独立项目工作区目录（AI 生成的项目代码、文档，与 DSH 系统隔离）
      - ./workspace:/workspace
      # 3. DSH 配置文件快照与备份存档目录（内含 versions/ 核心版本归档，Issue #7：回切免下载）
      - ./data/snapshots:/root/.dsh-snapshots
      # 4. Chromium 用户数据缓存（可选持久化保存浏览器登录状态与 Cookies）
      - ./data/browser:/root/.config/chromium
      # 5. npm / npx 缓存（Issue #18）：MCP 工具（如 `npx -y xxx mcp`）的安装缓存。
      #    不挂载时每次重建容器都要重新下载；慢网下极易在「写完签名前」被超时打断，
      #    导致 MCP 永久报 ENOENT: Could not read package.json（重启也无法自愈）。
      #    挂载后首次装好即可长期复用。体积随工具增长，可 `du -sh ./data/npm` 查看并按需清理。
      #    非 root 部署（user: 1001）请改为 ./data/npm:/home/dsh/.npm 并 chown 1001:1001。
      - ./data/npm:/root/.npm
      # 6. pnpm 缓存（Issue #18）：`pnpx` / `pnx` / `pnpm dlx` 起的 MCP 工具安装缓存。
      #    与 npx 同源问题：缺清单时报 ERR_PNPM_CLI_DLX_READ_MANIFEST 且不自愈。
      #    已有网关侧自愈兜底，故可安全持久化（首次装好即可长期复用）。
      - ./data/pnpm-cache:/root/.cache/pnpm
