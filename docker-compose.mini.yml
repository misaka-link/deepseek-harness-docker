# ========================================================
# docker-compose.mini.yml —— DeepSeek Harness 轻量精简版编排配置 (Issue #11)
# 镜像特性：C 档瘦身，移除了 Chromium 自动化浏览器、X11/noVNC 桌面与 Golang 工具链。
# 适用于纯文本 Agent、持久终端、代码工作区与轻量服务器部署。
# 启动方式: docker compose -f docker-compose.mini.yml up -d
# ========================================================

services:
  deepseek-harness:
    image: ghcr.io/misaka-link/deepseek-harness-docker:latest-mini
    container_name: deepseek-harness-mini
    restart: unless-stopped
    ports:
      # 仅暴露单个统一端口（包含 DSH Web 与管理面板，共享同一套认证）
      # M13：跟随 .env 的 PROXY_PORT（默认 3080），避免改了口令/端口后宿主映射静默失配
      - "${PROXY_PORT:-3080}:${PROXY_PORT:-3080}"
    environment:
      # 访问认证码（必须通过此认证码才可访问 DSH Web 与管理后台）
      # 留空时：首次访问会自动引导到「初始化访问口令」页面，设置后才能使用（不再有免密直通模式）
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      # 统一对外访问端口（M13：跟随 .env；显式 env 优先于数据卷中的持久化配置）
      - PROXY_PORT=${PROXY_PORT:-3080}
      # 运行根目录（M11：非 root 部署时设为 /home/dsh）
      - DSH_HOME=${DSH_HOME:-/root}
      # 版本切换前磁盘水位阈值(MB，默认 1536)；用于低配环境与故障演练
      - DSH_VERSIONS_MIN_FREE_MB=${DSH_VERSIONS_MIN_FREE_MB:-1536}

      # 出站网络代理（可选：DSH 原生遵循环境变量代理）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}

      # --- 以下参数均已在容器和网关内置默认值，默认注释保持简洁，按需启用：---
      # 【Issue #11】mini 镜像不包含容器桌面与 Chromium，桌面与截图参数已自动禁用
      # - SESSION_SECRET=${SESSION_SECRET:-}  # 自定义 Session 签名密钥 (默认自动生成并持久化至数据卷)
      # - ADMIN_PATH=/admin                  # 自定义管理面板访问路径 (默认 /admin)
      # - DSH_WORKSPACE=/workspace           # 默认工作区目录
      # - DSH_MAX_ARCHIVE_MEMBERS=1000000    # 快照还原/导入前的成员数上限 (默认 100 万；仅当快照确实超过此规模才需调高)

    # ── M11 容器加固 ─────────────────────────────────────────────
    # 1) 禁止提权（setuid/setgid 二进制无法获得新权限）
    security_opt:
      - no-new-privileges:true
    # 2) 丢弃全部 Linux capabilities，仅回补 root 运行必需的最小集合
    #    （入口脚本要修正数据卷属主/权限、创建并管理子进程）
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    # 3) 【可选】以非 root 运行（更彻底）：取消下面两行注释，并把 volumes 换成
    #    /home/dsh/.dsh 等路径（宿主目录需 chown 1001:1001）；此时可删除上面的 cap_add 段。
    # user: "1001:1001"
    # environment 里追加: - DSH_HOME=/home/dsh
    volumes:
      # 1. DSH 系统与配置目录（存储插件、预设、配置文件与会话历史）
      - ./data/dsh:/root/.dsh
      # 2. 独立项目工作区目录（AI 生成的项目代码、文档，与 DSH 系统隔离）
      - ./workspace:/workspace
      # 3. DSH 配置文件快照与备份存档目录（内含 versions/ 核心版本归档，Issue #7：回切免下载）
      - ./data/snapshots:/root/.dsh-snapshots
